services:
  postgres:
    image: postgres:16-alpine
    container_name: civicreport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-civicreport}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-civicreport_prod}
      POSTGRES_DB: ${DB_NAME:-civicreport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicreport"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicreport-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicreport-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-civicreport}:${DB_PASSWORD:-civicreport_prod}@postgres:5432/${DB_NAME:-civicreport}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_REGISTER_KEY: ${ADMIN_REGISTER_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      REDIS_URL: redis://redis:6379
      RESET_TOKEN_TTL_MINUTES: 60
      EXPOSE_RESET_TOKEN: "false"
      UPLOAD_PROVIDER: local
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: civicreport-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: civicreport-proxy
    restart: unless-stopped
    command: >
      sh -c '
      if [ -f /etc/nginx/ssl/cert.pem ] && [ -f /etc/nginx/ssl/key.pem ]; then
        echo "SSL certificates found — enabling HTTPS on port 443";
        cp /etc/nginx/ssl.conf.template /etc/nginx/conf.d/ssl.conf;
      else
        echo "No SSL certificates — running HTTP only";
        rm -f /etc/nginx/conf.d/ssl.conf;
      fi;
      nginx -g "daemon off;"'
    ports:
      - "${PORT:-80}:80"
      - "${SSL_PORT:-4443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl.conf.template:/etc/nginx/ssl.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  redisdata:
  uploads:
