services:
  postgres:
    image: postgres:16-alpine
    container_name: civicreport-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicreport
      POSTGRES_PASSWORD: civicreport_dev_2024
      POSTGRES_DB: civicreport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: civicreport-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
